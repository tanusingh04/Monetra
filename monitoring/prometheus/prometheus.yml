global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'payflow-api'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['payflow-api:8080']
        labels:
          application: 'payflow-api'
          environment: 'production'

  - job_name: 'payflow-worker'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['payflow-worker:8081']
        labels:
          application: 'payflow-worker'
          environment: 'production'
