server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: payflow-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payflow_db}
    username: ${SPRING_DATASOURCE_USERNAME:payflow_user}
    password: ${SPRING_DATASOURCE_PASSWORD:payflow_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000} # 24 hours
  kafka:
    topics:
      payment-events: payment-events
      payment-retry: payment-retry
      payment-dlq: payment-dlq
      fraud-alerts: fraud-alerts
  reputation:
    starting-score: 100
    clean-receipt-points: 5
    daily-gain-cap: 50
    allowance-completion-bonus: 20
    rejection-penalty: 10
    fraud-penalty: 100
    hysteresis: 15
    min-account-age-days: 7
    min-distinct-counterparties: 3
    global-max-allowance: 2000.0000
    global-max-single-tx: 500.0000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        payflow.payments.latency: true
        http.server.requests: true
      percentiles:
        payflow.payments.latency: 0.5, 0.95, 0.99
    tags:
      application: ${spring.application.name}
