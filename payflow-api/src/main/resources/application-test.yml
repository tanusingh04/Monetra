spring:
  application:
    name: payflow-api-test
  datasource:
    url: jdbc:h2:mem:payflow_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      auto-create: false

management:
  health:
    kafka:
      enabled: false
    redis:
      enabled: false

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 3600000
  outbox:
    polling-rate-ms: 3600000
  merkle:
    batch-builder:
      enabled: false
      interval-ms: 3600000
      initial-delay-ms: 3600000
      lag-seconds: 0
  kafka:
    topics:
      payment-events: payment-events
      payment-retry: payment-retry
      payment-dlq: payment-dlq
      fraud-alerts: fraud-alerts
  reputation:
    starting-score: 100
    clean-receipt-points: 5
    daily-gain-cap: 50
    allowance-completion-bonus: 20
    rejection-penalty: 10
    fraud-penalty: 100
    hysteresis: 15
    min-account-age-days: 0
    min-distinct-counterparties: 0
    global-max-allowance: 5000.0000
    global-max-single-tx: 2000.0000
    tiers:
      NEW:
        min-score: 0
        max-allowance: 2500.0000
        max-single-tx: 1000.0000
      BRONZE:
        min-score: 200
        max-allowance: 3000.0000
        max-single-tx: 1200.0000
      SILVER:
        min-score: 500
        max-allowance: 4000.0000
        max-single-tx: 1500.0000
      GOLD:
        min-score: 1000
        max-allowance: 5000.0000
        max-single-tx: 2000.0000
      RESTRICTED:
        min-score: 0
        max-allowance: 0.0000
        max-single-tx: 0.0000
